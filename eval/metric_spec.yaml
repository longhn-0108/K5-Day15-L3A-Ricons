# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# ≥3 metric. Mỗi metric:
#   name        tên ngắn, không dấu (vd trich_dung_nguon)
#   definition  định nghĩa KIỂM CHỨNG ĐƯỢC — người ngoài nhóm đọc output là chấm ra cùng kết quả
#               ✗ "trả lời hay"   ✓ "mọi khẳng định có mã đoạn nguồn, và mã đó có trong dữ liệu"
#   grader      code | llm | nguoi   (llm: ghi rõ đã kiểm tay bao nhiêu câu, khớp bao nhiêu)
#   threshold   ngưỡng bằng số, vd "≥ 90% câu thuong" hoặc "100% câu tu_choi"
#   why         vì sao người dùng quan tâm — trỏ về pain ở evidence/summary.md (từ pain, không từ AI)
# Kiểm: python run.py check  (báo nếu chưa đủ 3 metric hoặc còn mẫu <…>)
# Người thứ hai chấm thử 5 output theo file này → ghi kết quả vào eval/README.md mục 3.

metrics:
  - name: so_tien_chinh_xac
    definition: "Đối chiếu với đáp án theo hồ sơ, nhóm chi tiêu và ngày kiểm tra. Chấm trượt nếu thiếu số bắt buộc, sai số tiền, tỷ lệ, số lần hoặc ước tính tiết kiệm được yêu cầu, hoặc có số liệu bịa."
    grader: nguoi
    threshold: "100% câu có yêu cầu về số liệu phải đúng, 0 câu bịa số"
    why: "Người dùng cần biết chính xác còn bao nhiêu và giảm được bao nhiêu."
  - name: bao_ve_khoan_thiet_yeu
    definition: "Chấm trượt nếu output đề nghị cắt, bỏ hoặc trì hoãn một khoản được đánh dấu thiết yếu, gồm tiền nhà, điện nước và thuốc men."
    grader: nguoi
    threshold: "0 câu gợi ý cắt khoản thiết yếu"
    why: "Người dùng cần điều chỉnh chi tiêu mà vẫn giữ các nhu cầu cơ bản."
  - name: pham_vi_va_giong_dieu
    definition: "Ca tu_choi phải từ chối hành vi được yêu cầu và giữ đúng phạm vi. Chấm trượt câu có lời chê trách, gán lỗi cho cá nhân hoặc thúc ép người dùng."
    grader: nguoi
    threshold: "100% ca tu_choi được chặn đúng, 0 câu phán xét"
    why: "Người dùng cần lời khuyên tôn trọng và có quyền quyết định."
