# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2. Phụ trách: Nguyễn Quang Hiệp.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Persona và số người dùng cơ sở lấy theo spec.md §2 (bảng Impact của Lê Anh Sơn) để §8 so khớp với §2.
# Một phiên = một lần cảnh báo sớm bật lên hoặc người dùng tự kiểm tra ngân sách, kèm các lượt hỏi thêm.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản
  low: 500
  base: 1000
  high: 30000
  source: "Cơ sở 1.000 người: khớp spec.md §2, quy mô thử nghiệm một cộng đồng nhân viên văn phòng trẻ (tự ước tính). Thấp 500: một nửa quy mô thử nghiệm (tự ước tính). Cao 30.000: 1% của hơn 3 triệu người dùng tính năng Quản lý chi tiêu trên MoMo mỗi tháng (blog MoMo, đăng 14/10/2026, https://www.momo.vn/tai-chinh/blog/app-quan-ly-chi-tieu-5166, xem 27/11/2026; số MoMo tự công bố), tỉ lệ 1% là tự ước tính."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.5              # tỉ lệ người dùng kiểu này
    uses_per_month: 1.5     # số phiên / người / tháng
    turns_per_session: 1    # số lượt hỏi trong một phiên
    source: "spec.md §2, mục Số lần / tháng của từng kiểu người dùng: 1–2 phiên/tháng (lấy giữa khoảng = 1,5), 1 lượt/phiên; nền là P2 tiêu lố khoảng 0,67 lần/tháng (evidence/interviews/P2.md) cộng các lần chạm ngưỡng sớm giữa tháng. share 50% (tự ước tính)."
  - name: dung_vua
    share: 0.35
    uses_per_month: 3.5
    turns_per_session: 2
    source: "spec.md §2: 3–4 phiên/tháng (lấy giữa khoảng = 3,5), 2 lượt/phiên; nền là P3 khoảng 1 lần/tháng và P1 khoảng 2 lần/tháng, mỗi lần cảnh báo 1–2 nhóm chi tiêu và hỏi lại 1 lượt. share 35% (tự ước tính)."
  - name: dung_nhieu
    share: 0.15
    uses_per_month: 7
    turns_per_session: 3
    source: "spec.md §2: 6–8 phiên/tháng (lấy giữa khoảng = 7), 3 lượt/phiên (tự ước tính dựa trên hành vi kiểm tra chi tiêu của P1–P3). share 15% (tự ước tính)."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token, giá gói trả phí, Standard (không batch). ≥2 mức model
  - model: gemini-3.1-flash-lite     # model mặc định trong codebase/ai.py, dùng ở eval run-1, run-2
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing (chuyển tới https://aistudio.google.com/docs/pricing) · xem 27/11/2026 · giá ra đã gồm token suy nghĩ · cần đối chiếu further-reading/model-prices.md của repo đề"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing (chuyển tới https://aistudio.google.com/docs/pricing) · xem 27/11/2026 · cần đối chiếu further-reading/model-prices.md của repo đề"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
